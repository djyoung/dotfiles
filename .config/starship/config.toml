"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.start}\
    $os\
    $username\
    $directory\
    $git_branch\
    $git_status\
${custom.end}
$character"""

palette = 'custom'

[custom.start]
when = true
symbol = ""
style = "red"
format = "[$symbol]($style)"

[custom.end]
when = true
symbol = ""
style = "prev_fg"
format = "[$symbol]($style)"

[os]
disabled = false
style = 'inverted prev_fg'
format = "[$symbol]($style)"

[os.symbols]
Macos = '󰀵'

[username]
show_always = true
style_user = 'inverted prev_fg'
style_root = 'inverted prev_fg'
format ='[ $user ]($style)'

[directory]
style = 'inverted peach'
format = '[](bg:peach prev_fg)[ $path ]($style)'
truncation_symbol = '…/'

[git_branch]
symbol = ""
style = 'inverted yellow'
format = '[](bg:yellow prev_fg)[ $symbol $branch ]($style)'

[git_status]
style = "inverted yellow"
format = '([$all_status$ahead_behind ]($style))'

[palettes.custom]
peach = '208'
